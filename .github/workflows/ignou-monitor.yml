name: IGNOU Automatic Monitor

on:
  push:
    paths:
      - "scripts/monitor.mjs"
      - ".github/workflows/ignou-monitor.yml"
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run official-source monitor
        run: node scripts/monitor.mjs
      - name: Commit monitor snapshot
        run: |
          git config user.name "IGNOU Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add public/monitor.json
          git diff --cached --quiet && exit 0
          git commit -m "Update IGNOU automatic monitor snapshot"
          git push
